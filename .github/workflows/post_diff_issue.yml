name: Post Diff to Issue
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  post_diff:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create Diff Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 日本語の件名を文字単位で切るため（バイト単位で切ると文字化けする）
          LC_ALL: C.UTF-8
        run: |
          # 最新の変更差分を取得（初回などで差分がない場合のエラーも回避）
          git diff HEAD~1 > diff.txt 2>/dev/null || echo "変更差分がありません、または初回コミットです。" > diff.txt

          # レビュー依頼にそのまま貼りやすい本文を作る：変更の要約（commit message）・変更ファイル一覧・差分
          # 差分はコードブロックで囲み（Markdown として崩れないように）、Issue 本文の上限（約65,000字）を超えないよう切り詰める
          {
            echo "対象 commit: ${GITHUB_SHA}"
            echo
            echo "## 変更の要約（commit message）"
            git log --no-merges --format='### %s%n%n%b' HEAD~1..HEAD 2>/dev/null || true
            echo "## 変更ファイル"
            echo '```'
            git diff --stat HEAD~1 2>/dev/null || true
            echo '```'
            echo "## 差分"
            echo '````diff'
            head -c 50000 diff.txt
            echo
            echo '````'
            if [ "$(wc -c < diff.txt)" -gt 50000 ]; then
              echo "※ 差分が大きいため途中で切り詰めました。全体は ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA} で確認してください。"
            fi
          } > body.md

          # タイトル：「📝 {最新コミットの件名}[ ほかN件] ({短いSHA})」
          # 件名は変数に入れて必ず "" で囲む（引用符・バッククォート・$ を含んでもシェルが壊れないように）
          subjects=$(git log --no-merges --format='%s' HEAD~1..HEAD 2>/dev/null || true)
          if [ -n "$subjects" ]; then
            summary="${subjects%%$'\n'*}"
            count=$(printf '%s\n' "$subjects" | wc -l)
          else
            # 範囲が空（手動実行など）のときは HEAD の件名を使う
            summary=$(git log -1 --format='%s' HEAD)
            count=1
          fi
          if [ "${#summary}" -gt 60 ]; then
            summary="${summary:0:60}…"
          fi
          if [ "$count" -gt 1 ]; then
            summary="${summary} ほか$((count - 1))件"
          fi
          title="📝 ${summary} (${GITHUB_SHA:0:7})"

          # Issueを作成して差分を投稿
          gh issue create --title "$title" --body-file body.md
