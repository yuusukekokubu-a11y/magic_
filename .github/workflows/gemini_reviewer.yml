name: Post Diff to Issue
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  post_diff:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Create Diff Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 最新の変更差分を取得（初回などで差分がない場合のエラーも回避）
          git diff HEAD~1 > diff.txt || echo "変更差分がありません、または初回コミットです。" > diff.txt
          
          # Issueを作成して差分を投稿
          gh issue create --title "📝 最新の変更差分 (Gemini壁打ち用)" --body-file diff.txt
