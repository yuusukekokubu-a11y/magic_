name: Generate Claude Instruction
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install google-generativeai
      - name: Generate and Post Issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > run_gemini.py
          import os, subprocess, google.generativeai as genai
          genai.configure(api_key=os.environ['GEMINI_API_KEY'])
          model = genai.GenerativeModel('gemini-1.5-pro')
          try:
              diff = subprocess.check_output(['git', 'diff', 'HEAD~1']).decode('utf-8')
          except:
              diff = 'No diff available'
          prompt = f"以下の最新のGit差分を元に、次に実装すべき内容をClaudeに渡すための明確な指示書を作成してください。Claudeのトークン節約のため、修正が必要な最小限のコードのみを含めてください。\n\n【差分】\n{diff}"
          response = model.generate_content(prompt)
          with open("instruction.md", "w") as f:
              f.write(response.text)
          EOF
          python run_gemini.py
          gh issue create --title "🤖 Claude用 次の改修指示書" --body-file instruction.md
