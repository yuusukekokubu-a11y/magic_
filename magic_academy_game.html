<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>星見の魔法学院 ― 三年間の育成記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eeeaf6; --panel:#faf8fe; --panel2:#f1edf9; --ink:#251f45; --muted:#6a6290; --line:#d8d0ea;
  --brass:#936a1c; --brass-soft:#f3e6c8; --danger:#c24a33; --ok:#2f8a63; --star:#b7892f;
  --shadow:0 1px 0 rgba(37,31,69,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1735; --panel:#252048; --panel2:#2d2755; --ink:#ece6f9; --muted:#a79ecb; --line:#3b3468;
    --brass:#d6ae5c; --brass-soft:#3b3152; --danger:#ea7a60; --ok:#6cc79c; --star:#f0cf7c; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#1b1735; --panel:#252048; --panel2:#2d2755; --ink:#ece6f9; --muted:#a79ecb; --line:#3b3468;
  --brass:#d6ae5c; --brass-soft:#3b3152; --danger:#ea7a60; --ok:#6cc79c; --star:#f0cf7c; --shadow:none;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif; font-size:15px; line-height:1.7; }
h1,h2,h3{ font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }
.wrap{ max-width:1120px; margin:0 auto; padding:16px 16px 40px; }

/* header */
.top{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:8px 20px; margin-bottom:14px; }
.top h1{ margin:0; font-size:22px; letter-spacing:.06em; font-weight:800; }
.when{ font-family:"Shippori Mincho B1",serif; font-size:28px; font-weight:800; line-height:1; }
.when small{ font-size:14px; color:var(--muted); font-weight:600; margin-left:8px; }

/* constellation track */
.track{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:16px; box-shadow:var(--shadow); }
.yr{ display:grid; grid-template-columns:56px 1fr; align-items:center; gap:8px; }
.yr + .yr{ margin-top:4px; }
.yr > span{ font-size:12px; color:var(--muted); }
.dots{ display:flex; align-items:center; gap:0; position:relative; }
.dots::before{ content:""; position:absolute; left:4px; right:14px; top:50%; height:1px; background:var(--line); }
.tk{ position:relative; flex:1; display:flex; justify-content:center; }
.tk i{ width:8px; height:8px; border-radius:50%; background:var(--panel); border:1px solid var(--muted); display:block; }
.tk.done i{ background:var(--muted); }
.tk.now i{ width:12px; height:12px; background:var(--star); border-color:var(--star); box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 25%,transparent); }
.tk.camp i{ border-color:var(--brass); border-width:2px; }
.tk em{ position:absolute; top:calc(100% + 1px); font-style:normal; font-size:10px; color:var(--star); white-space:nowrap; font-weight:700; }
.yr + .yr{ margin-top:8px; }
.when .wk{ font-size:18px; margin-left:8px; }
.campbar{ margin-top:14px; background:var(--brass-soft); color:var(--brass); border-radius:10px; padding:6px 12px; font-size:13px; font-weight:700; }
.prog{ display:block; height:4px; background:var(--panel); border-radius:99px; margin:4px 8px 0; overflow:hidden; }
.prog span{ display:block; height:100%; background:var(--brass); }
.tk.exam{ flex:0 0 auto; margin-left:6px; }
.tk.exam b{ font-size:18px; line-height:1; color:var(--muted); }
.tk.exam.won b{ color:var(--star); }
.tk.exam.lost b{ color:var(--danger); opacity:.7; }
.tk.exam em{ position:absolute; top:100%; font-style:normal; font-size:10px; color:var(--muted); white-space:nowrap; }

.grid{ display:grid; grid-template-columns:minmax(0,380px) minmax(0,1fr); gap:16px; align-items:start; }
@media (max-width:820px){ .grid{ grid-template-columns:1fr; } }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }

/* student card */
.who{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; }
.who h2{ margin:0; font-size:24px; font-weight:800; }
.tag{ display:inline-block; font-size:12px; padding:1px 9px; border-radius:99px; border:1px solid var(--line); color:var(--muted); margin-right:4px; }
.tag.origin{ border-color:var(--brass); color:var(--brass); }
.el{ display:inline-block; font-size:12px; font-weight:700; padding:0 7px; border-radius:6px; color:#fff; }
.stats{ margin:14px 0 10px; display:grid; gap:7px; }
.st{ display:grid; grid-template-columns:5.5em 1.6em 3em 1fr; align-items:center; gap:8px; font-size:14px; }
.st .g{ font-family:"Shippori Mincho B1",serif; font-weight:800; font-size:18px; text-align:center; color:var(--brass); }
.st .v{ text-align:right; font-variant-numeric:tabular-nums; }
.bar{ height:6px; background:var(--panel2); border-radius:99px; overflow:hidden; }
.bar > span{ display:block; height:100%; background:var(--brass); border-radius:99px; transition:width .4s; }
.meta{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; font-size:13px; }
.meta .k{ color:var(--muted); display:block; font-size:12px; }
.meta strong{ font-size:16px; }
.fat .bar > span{ background:var(--ok); }
.fat.warn .bar > span{ background:#d19a2e; }
.fat.bad .bar > span{ background:var(--danger); }

/* commands */
.cmds h3{ margin:18px 0 8px; font-size:15px; }
.lessons{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.lessons button{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 2px; font-size:13px; line-height:1.3; }
.lessons button small{ display:block; font-size:10px; color:var(--muted); }
.others{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:6px; }
.others button{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px 4px; font-weight:700; line-height:1.3; }
.others button small{ display:block; font-weight:400; font-size:11px; color:var(--muted); }
.lessons button:hover,.others button:hover{ border-color:var(--brass); }
.risk{ font-size:12px; color:var(--muted); margin-top:8px; min-height:1.4em; }
.risk.hot{ color:var(--danger); font-weight:700; }

/* tabs */
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:-4px -4px 12px; padding:0 4px; }
.tabs button{ background:none; border:none; padding:8px 12px; border-bottom:2px solid transparent; color:var(--muted); font-weight:700; }
.tabs button[aria-selected="true"]{ color:var(--ink); border-color:var(--brass); }
.log{ max-height:560px; overflow:auto; }
.turnlog{ padding:8px 0; border-bottom:1px dashed var(--line); }
.turnlog h4{ margin:0 0 2px; font-size:12px; color:var(--muted); font-weight:500; }
.turnlog p{ margin:0; font-size:14px; white-space:pre-line; }
.turnlog p.ev{ color:var(--brass); }
.turnlog p.bad{ color:var(--danger); }
.turnlog.newest{ animation:glow 1.2s ease-out; }
@keyframes glow{ from{ background:var(--brass-soft);} to{ background:transparent; } }
.syn{ background:var(--panel2); border-radius:10px; padding:8px 12px; font-size:13px; margin-bottom:8px; }
.plist{ display:grid; gap:6px; }
.plist div{ font-size:14px; }
.plist div span{ color:var(--muted); font-size:12px; margin-left:6px; }
.bond{ display:grid; grid-template-columns:7.5em 1fr 2.5em; gap:8px; align-items:center; font-size:14px; margin:4px 0; }
.bond .bar > span{ background:var(--star); }
.note{ font-size:13px; color:var(--muted); }

/* overlay */
.ov{ position:fixed; inset:0; background:color-mix(in srgb,var(--bg) 70%,transparent); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:10; }
.ov.show{ display:flex; }
.modal{ background:var(--panel); border:1px solid var(--line); border-radius:16px; width:min(720px,100%); max-height:100%; overflow:auto; padding:20px; }
.modal h2{ margin:0 0 4px; font-size:24px; }
.vs{ display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin:14px 0; }
.vs .x{ font-family:"Shippori Mincho B1",serif; font-weight:800; color:var(--brass); }
.side .nm{ font-weight:700; font-size:15px; }
.side .hp{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; }
.side .bar{ height:10px; margin:4px 0; }
.side.me .bar > span{ background:var(--ok); transition:width .25s; }
.side.op .bar > span{ background:var(--danger); transition:width .25s; }
.side.op{ text-align:right; }
.side .sh{ color:#5e9bd6; }
.oppspells{ font-size:12px; color:var(--muted); }
.blog{ height:240px; overflow:auto; background:var(--panel2); border-radius:10px; padding:8px 12px; font-size:13px; }
.blog div{ padding:1px 0; }
.blog .me{ color:var(--ink); }
.blog .op{ color:var(--muted); }
.blog .heal{ color:var(--ok); }
.blog .miss{ opacity:.6; }
.blog .t{ display:inline-block; width:2.6em; color:var(--muted); font-variant-numeric:tabular-nums; }
.row{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap; }
.btn{ background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 18px; font-weight:700; }
.btn.main{ background:var(--brass); color:var(--panel); border-color:var(--brass); }
.result{ font-family:"Shippori Mincho B1",serif; font-size:22px; font-weight:800; margin-top:10px; }
.result.win{ color:var(--brass); } .result.lose{ color:var(--danger); }
.rlines p{ margin:2px 0; font-size:14px; }

/* title */
.hero{ min-height:calc(100vh - 80px); display:grid; place-items:center; text-align:center; }
.hero h1{ font-size:clamp(34px,7vw,64px); font-weight:800; letter-spacing:.12em; margin:0; line-height:1.25; }
.hero p.lead{ color:var(--muted); margin:10px auto 26px; max-width:32em; }
.sky{ font-size:13px; color:var(--star); letter-spacing:.9em; margin-bottom:18px; }
.namef{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.namef input{ font:inherit; padding:9px 14px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--ink); width:12em; }
.reveal{ text-align:left; }
.reveal .big{ font-family:"Shippori Mincho B1",serif; font-size:34px; font-weight:800; color:var(--brass); }
.rank{ font-family:"Shippori Mincho B1",serif; font-size:88px; font-weight:800; line-height:1; color:var(--brass); }
details{ margin-top:14px; font-size:13px; color:var(--muted); }
details summary{ cursor:pointer; color:var(--ink); }
.themebtn{ background:none; border:1px solid var(--line); border-radius:99px; padding:2px 10px; font-size:12px; color:var(--muted); }
/* 変化バッジ */
.dlt{ display:inline-block; font-size:12px; font-weight:700; margin-left:4px; padding:0 6px; border-radius:99px; animation:pop .5s ease-out; }
.dlt.up{ color:var(--ok); background:color-mix(in srgb,var(--ok) 14%,transparent); }
.dlt.down{ color:var(--danger); background:color-mix(in srgb,var(--danger) 14%,transparent); }
@keyframes pop{ 0%{ transform:scale(.4); opacity:0;} 60%{ transform:scale(1.2); opacity:1;} 100%{ transform:scale(1);} }
.st{ grid-template-columns:5.5em 1.6em 3em 3.4em 1fr; }
.st .dcell{ text-align:left; }
.bar > span.gain{ background:var(--ok); }
.changes{ background:var(--panel2); border-radius:10px; padding:8px 12px; font-size:13px; margin-top:12px; }
.changes b{ font-weight:700; margin-right:6px; }
/* ポップアップ */
.pop .kicker{ font-size:12px; color:var(--muted); }
.pop h2{ margin:2px 0 8px; }
.pop.big h2{ color:var(--brass); font-size:28px; }
.pop.bad h2{ color:var(--danger); }
.pop .txt{ margin:0 0 10px; white-space:pre-line; line-height:1.8; }
.sex{ font-size:12px; font-weight:700; }
.sex.m{ color:#4a86c8; } .sex.f{ color:#d0668f; }
.dtable{ width:auto; min-width:min(100%,380px); border-collapse:collapse; font-size:14px; margin:6px 0 4px; }
.dtable td{ padding:5px 4px; border-bottom:1px dashed var(--line); font-variant-numeric:tabular-nums; }
.dtable td:nth-child(2),.dtable td:nth-child(3){ text-align:right; }
.dtable td:last-child{ text-align:right; font-weight:700; width:4.5em; }
.dtable .arrow{ color:var(--muted); text-align:center!important; width:1.5em; }
.gotcard{ border:1px solid var(--brass); border-radius:12px; padding:10px 14px; margin-top:10px; background:var(--brass-soft); }
.gotcard .n{ font-weight:700; font-size:16px; }
.gotcard .d{ font-size:13px; color:var(--muted); }
.kv{ display:grid; grid-template-columns:repeat(auto-fit,minmax(88px,1fr)); gap:6px; margin-top:8px; }
.kv div{ background:var(--panel); border-radius:8px; padding:4px 8px; font-size:12px; color:var(--muted); }
.kv b{ display:block; font-size:16px; color:var(--ink); font-variant-numeric:tabular-nums; }
/* 魔法表 */
.tblwrap{ overflow-x:auto; margin:0 -4px; }
.sptbl{ width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
.sptbl th{ text-align:right; font-weight:500; color:var(--muted); font-size:12px; padding:6px 6px; border-bottom:1px solid var(--line); white-space:nowrap; }
.sptbl th:first-child{ text-align:left; }
.sptbl td{ padding:8px 6px; border-bottom:1px dashed var(--line); text-align:right; font-variant-numeric:tabular-nums; vertical-align:top; }
.sptbl td:first-child{ text-align:left; }
.sptbl .nm{ font-weight:700; }
.sptbl .ds{ display:block; font-size:11px; color:var(--muted); font-weight:400; }
.sptbl tr.off td{ opacity:.55; }
.sptbl tr.off td:last-child{ opacity:1; }
.sptbl button{ background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:3px 10px; font-size:12px; white-space:nowrap; }
.sptbl button.on{ background:var(--brass); color:var(--panel); border-color:var(--brass); font-weight:700; }
.best{ color:var(--brass); font-weight:700; }
.bd{ margin-top:10px; }
.bd h3{ font-size:14px; margin:8px 0 4px; }
/* 選択肢 */
.speaker{ font-size:14px; margin-bottom:2px; }
.sgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:8px; }
.scard{ text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:grid; gap:3px; }
.scard:hover{ border-color:var(--brass); }
.scard.partner{ border-color:var(--star); }
.sbar{ display:grid; grid-template-columns:1fr 2.2em; gap:6px; align-items:center; font-size:12px; }
.sbar .bar{ background:var(--panel); }
.gtbl td{ vertical-align:middle; }
.gtbl td.num, .gtbl th{ text-align:center; }
.gtbl th:first-child, .gtbl td:nth-child(2){ text-align:left; }
.gp{ color:var(--muted); font-size:11px; } .gr{ color:var(--ok); font-size:11px; font-weight:700; } .gs{ color:var(--danger); font-size:11px; }
.scard.away{ opacity:.5; cursor:not-allowed; filter:grayscale(.6); }
.scard.away:hover{ border-color:var(--line); }
.scard.away .snext{ color:var(--muted); }
.awaytxt{ color:var(--danger); } .heretxt{ color:var(--ok); }
.sbar .bar > span{ background:var(--star); }
.snext{ font-size:12px; color:var(--brass); font-weight:700; }
.ghead{ font-size:15px; margin:14px 0 6px; }
.ghead .note{ font-weight:400; margin-left:4px; }
.kind{ font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:0 5px; }
.pbadge{ font-size:11px; color:#fff; background:var(--brass); border-radius:6px; padding:0 6px; }
.subaff{ font-size:11px; color:var(--muted); }
.partnerline{ margin-top:2px; }
.bondbox{ background:var(--panel2); border-radius:10px; padding:8px 12px; margin:4px 0 8px; max-width:420px; }
.bondbox .bh{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:4px; }
.bondbox .bar{ display:flex; height:8px; margin-bottom:4px; }
.bondbox .bar > span{ background:var(--star); }
.bondbox .bar > span.gain{ background:var(--ok); }
.cheer{ background:var(--brass-soft); border:1px solid var(--star); border-radius:12px; padding:10px 14px; margin:10px 0; }
.cheer .txt{ margin:4px 0; }
.cheer.rival{ background:var(--panel2); border-color:var(--line); }
.mm{ font-size:11px; font-weight:700; border-radius:6px; padding:0 6px; margin-left:4px; white-space:nowrap; }
.mm.good{ color:var(--ok); background:color-mix(in srgb,var(--ok) 14%,transparent); }
.mm.bad{ color:var(--danger); background:color-mix(in srgb,var(--danger) 12%,transparent); }
.oppc .d{ margin-top:2px; }
.phead{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin-top:6px; }
.plist2{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:6px; margin-top:6px; }
.prow{ display:flex; align-items:center; gap:6px; text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:7px 10px; font-size:14px; }
.prow.on{ border-color:var(--brass); background:var(--brass-soft); }
.prow .pst{ margin-left:auto; font-size:11px; color:var(--brass); font-weight:700; }
.choices{ display:grid; gap:8px; margin-top:6px; }
.choice{ text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:2px; }
.warnmsg{ color:var(--danger); font-size:13px; font-weight:700; margin:0 0 8px; }
.choice:hover{ border-color:var(--brass); }
.choice .cl{ font-weight:700; font-size:15px; }
.choice .ch{ font-size:12px; color:var(--muted); }
.rgrid{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:8px; }
@media (max-width:640px){ .rgrid{ grid-template-columns:1fr; } }
.rcard{ text-align:left; background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:4px; }
.rcard:hover{ border-color:var(--brass); }
.rcard .n{ font-weight:700; font-size:17px; font-family:"Shippori Mincho B1",serif; }
.rcard .d{ font-size:12px; color:var(--muted); }
.rcard .kv div{ background:var(--panel); }
.rcard .pickl{ margin-top:auto; padding-top:8px; font-size:13px; font-weight:700; color:var(--brass); }
.badge{ display:inline-block; font-size:11px; font-weight:700; padding:0 7px; border-radius:6px; margin-left:4px; border:1px solid var(--line); }
.badge.new{ color:var(--ok); border-color:var(--ok); }
.badge.up{ color:var(--brass); border-color:var(--brass); }
.badge.aff{ color:var(--brass); border-color:var(--brass); background:var(--brass-soft); }
.badge.rare{ color:#fff; background:var(--brass); border-color:var(--brass); }
/* ステータス変化の演出 */
.st, [data-k="fatigue"], [data-k="cond"]{ position:relative; border-radius:8px; }
.st .bar > span, [data-k="fatigue"] .bar > span{ transition:width .7s cubic-bezier(.2,.8,.2,1); }
.fl-up{ animation:flUp 1.3s ease-out; }
.fl-down{ animation:flDown 1.3s ease-out; }
@keyframes flUp{ 0%{ background:color-mix(in srgb,var(--ok) 32%,transparent); } 100%{ background:transparent; } }
@keyframes flDown{ 0%{ background:color-mix(in srgb,var(--danger) 28%,transparent); } 100%{ background:transparent; } }
.float{ position:absolute; right:6px; top:-2px; font-weight:800; font-size:16px; pointer-events:none; animation:rise 1.4s ease-out forwards; }
.float.up{ color:var(--ok); } .float.down{ color:var(--danger); }
@keyframes rise{ 0%{ transform:translateY(8px) scale(.7); opacity:0; } 15%{ transform:translateY(0) scale(1.15); opacity:1; } 70%{ opacity:1; } 100%{ transform:translateY(-22px); opacity:0; } }
.g.rankup{ animation:rankUp 1.4s ease-out; border-radius:6px; }
.g.rankdown{ animation:flDown 1.2s ease-out; border-radius:6px; }
@keyframes rankUp{ 0%{ transform:scale(1); } 25%{ transform:scale(1.8); color:var(--star); text-shadow:0 0 12px var(--star); } 100%{ transform:scale(1); } }

<script>
// =====================================================================
//  星見の魔法学院 ― ゲームロジック（UIに依存しない部分）
// ---------------------------------------------------------------------
//  このファイルは画面を一切触らない。ブラウザでも Node.js でも動くので、
//  tests/ 以下の自動テスト・バランス検証から直接 require できる。
//
//  目次（「// =====」で検索すると飛べます）
//    暦 ..................... 週数・試験の週・特別期間はシナリオが決める（SC）
//    データ定義 ............. 出自 / 魔法 / 属性適性 AFF / 属性相性 BEATS・MATCH / 特性 /
//                             人物 CHARS・物語 CHAR_STORY（セリフもここ）
//    生徒生成 ............... newStudent：出自・初期値・属性適性の抽選
//    育成コマンド ........... doTrain / doResearch / doSocial(相手) / doRest
//    行動中イベント ......... 授業・研究・休息で起きる選択式イベント
//    効果データ ............. applyFx / fxHint（物語の選択肢などの効果をデータで書く）
//    習得チャレンジ ......... 確率制の特性・魔法習得と再挑戦（pending）
//    ターン開始時イベント ... EVENTS（共通）＋シナリオ固有、発生順は SC.turnEventOrder
//    魔法の性能計算 ......... 画面表示用（戦闘と同じ式）
//    戦闘 ................... CT制オートバトル（battle）、相性 matchMul
//    対戦相手 ............... makeOpponent / getOpponent（告知済みの相手） / recommendEquip
//    シナリオ ............... SCENARIOS.main（本編）と setScenario
//
//  状態オブジェクト s（生徒）の主な項目
//    stats{hp,atk,int,def,acc} 内部は小数・表示は四捨五入
//    fatigue 0〜100 / cond 0〜4（絶不調〜絶好調） / research 研究進捗%
//    spells[{id,lv}] 習得魔法 / equip[id] 装備中（数は slots(s) 以下）
//    passives[id] 特性 / bonds{人物:0〜100} / pending[] 習得挑戦中
//    affinity[属性] 主適性 / partner 人物id / sub サブ適性 / oppPlan{} 告知済みの対戦相手
//    flags{} 一度きりイベントの発生済み記録 / results{} 試験結果
//
//  バランス調整でよく触る数値
//    授業の成長量 ........ doTrain の spread（週あたり）
//    絆の上昇量 .......... doSocial の bond = ri(4, 7)
//    研究の進み .......... doResearch の inc
//    イベント発生率 ...... CMD_EVENT_RATE、turnEvents 内の wk(…)
//    習得の成功率 ........ 各 att の base、attemptRate（失敗1回ごと+20%）
//    適性・相性 .......... AFF / MATCH（tests/element_matrix.js で確認）
//    敵の強さ ............ SCENARIOS.main.opponents（tools/tune_opponents.py で倍率調整）
//  数値を変えたら必ず tests/invariants.js と tests/balance_sim.js を実行する。
// =====================================================================
const RNG = { r: Math.random };
const rnd = () => RNG.r();
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function wpick(items, wf) {
  const ws = items.map(wf); const t = ws.reduce((a, b) => a + b, 0);
  let x = rnd() * t;
  for (let i = 0; i < items.length; i++) { x -= ws[i]; if (x <= 0) return items[i]; }
  return items[items.length - 1];
}

// ===== 暦（週単位） =====
// 週数・試験の週・特別期間はシナリオ（ファイル末尾の SCENARIOS）が決める。setScenario() で切り替える。
let SC = null;                                     // 現在のシナリオ
let WPM = 4, TOTAL = 144, EXAM_WEEK = {};          // setScenario() が上書きする
const monthIdx = t => Math.ceil(t / WPM);          // 通算の月（1〜）
const weekOf = t => (t - 1) % WPM + 1;             // その月の第何週か
const specialOf = t => (SC && SC.special ? SC.special(t) : null);   // 特別期間（夏合宿など）。なければ null
const isCamp = t => { const p = specialOf(t); return !!(p && p.trainMul); };
const wk = p => 1 - Math.pow(1 - p, 1 / WPM);      // 「月あたりp」を「週あたり」の確率に換算

const STATS = ['hp', 'atk', 'int', 'def', 'acc'];
const STAT_NAME = { hp: '体力', atk: '魔法攻撃', int: '知力', def: '魔法防御', acc: '精度' };
const SUBJECT = { hp: '魔法体術', atk: '攻撃魔法学', int: '魔導理論', def: '結界学', acc: '魔力制御' };
const ELEM = {
  fire: { n: '火', c: '#e0673f' }, water: { n: '水', c: '#3f8fd8' }, wood: { n: '木', c: '#4e9a3a' },
  light: { n: '光', c: '#d8b93a' }, dark: { n: '闇', c: '#9a5fd0' },

const COND = ['絶不調', '不調', '普通', '好調', '絶好調'];

// ===== データ定義 =====
// ---- 出自 ----

  noble: { n: '貴族', p: 25, init: { hp: 150, atk: 30, int: 36, def: 34, acc: 30 },
    grow: { hp: 0.9, atk: 0.95, int: 1.12, def: 1.12, acc: 0.95 }, desc: '知力・魔法防御が伸びやすく、交流で絆を得やすい。体力はやや伸び悩む。' },
  orphan: { n: '孤児', p: 17, init: { hp: 140, atk: 25, int: 25, def: 25, acc: 25 },
    grow: null, desc: '初期値は低いが、2つの「才能」ステータスが大きく伸びる。覚醒イベントの可能性あり。' },
  heir: { n: '大魔法使いの子', p: 3, init: { hp: 170, atk: 42, int: 42, def: 36, acc: 38 },
    grow: { hp: 1.1, atk: 1.14, int: 1.14, def: 1.1, acc: 1.14 }, desc: '全ステータスの伸びと魔法適性が高い。属性適性を2つ持つ。' },
};

// ---- 魔法 ----
// t: dmg / heal / buff / debuff / shield
const SPELLS = [
  { id: 'f1', el: 'fire', n: 'ファイアボルト', ct: 3, t: 'dmg', pow: 1.0 },
  { id: 'f2', el: 'fire', n: 'フレイムランス', ct: 5, t: 'dmg', pow: 1.6 },
  { id: 'f3', el: 'fire', n: 'ヒートブランド', ct: 5, t: 'dmg', pow: 0.7, burn: 0.3 },
  { id: 'f4', el: 'fire', n: 'インフェルノ', ct: 9, t: 'dmg', pow: 3.0, rare: 1 },
  { id: 'w1', el: 'water', n: 'アクアショット', ct: 3, t: 'dmg', pow: 1.1, accB: 20 },
  { id: 'w2', el: 'water', n: 'バブルプリズン', ct: 6, t: 'dmg', pow: 0.75, delay: 2 },
  { id: 'w3', el: 'water', n: 'ミストヴェール', ct: 8, t: 'debuff', stat: 'acc', val: -25, dur: 8 },
  { id: 'w4', el: 'water', n: 'タイダルウェーブ', ct: 7, t: 'dmg', pow: 2.1, accB: 15, delay: 1, rare: 1 },
  // 木：持久・再生の属性（棘の連射、吸い取る毒、樹皮の守り、再生）
  { id: 'g1', el: 'wood', n: 'ソーンバレット', ct: 2, t: 'dmg', pow: 0.6, hits: 2 },
  { id: 'g2', el: 'wood', n: '宿り木の種', ct: 5, t: 'dmg', pow: 0.5, burn: 0.35, drain: 1 },
  { id: 'g3', el: 'wood', n: '樹皮の鎧', ct: 9, t: 'buff', stat: 'def', val: 0.35, dur: 8 },
  { id: 'g4', el: 'wood', n: '世界樹の恵み', ct: 9, t: 'buff', stat: 'regen', val: 0.06, dur: 6, rare: 1 },
  { id: 'l1', el: 'light', n: 'ライトアロー', ct: 3, t: 'dmg', pow: 1.25 },
  { id: 'l2', el: 'light', n: 'ヒール', ct: 6, t: 'heal', val: 0.25 },
  { id: 'l3', el: 'light', n: '祝福', ct: 8, t: 'buff', stat: 'atk', val: 0.4, dur: 8 },
  { id: 'l4', el: 'light', n: 'セイクリッドレイ', ct: 6, t: 'dmg', pow: 1.95, lifesteal: 0.4, rare: 1 },
  { id: 'd1', el: 'dark', n: 'シャドウボルト', ct: 3, t: 'dmg', pow: 1.18, self: 0.03 },
  { id: 'd2', el: 'dark', n: '呪詛', ct: 7, t: 'debuff', stat: 'def', val: -0.35, dur: 8 },

];
const SPELL = Object.fromEntries(SPELLS.map(s => [s.id, s]));
const BASIC = { id: 'basic', el: null, n: '魔力弾', ct: 2, t: 'dmg', pow: 0.6 };

function spellDesc(s) {
  const p = [];
  if (s.t === 'dmg') {
    p.push(`威力${s.hits ? s.pow + '×' + s.hits : s.pow}`);
    if (s.accB) p.push(`命中+${s.accB}`);
    if (s.burn) p.push(s.drain ? '毒（4tick継続ダメージ・与えた分を吸収）' : '火傷（4tick継続ダメージ）');
    if (s.delay) p.push(`相手の全CT+${s.delay}`);
    if (s.lifesteal) p.push(`与ダメの${s.lifesteal * 100}%回復`);
    if (s.self) p.push(`自傷${s.self * 100}%`);
    if (s.crit) p.push(`会心率+${s.crit * 100}%`);
    if (s.defScale) p.push('自身の魔法防御も威力に加算');
  } else if (s.t === 'heal') p.push(`最大HPの${s.val * 100}%回復（使うたび効果減衰）`);
  else if (s.t === 'shield') p.push('魔法防御に応じたバリア');
  else if (s.t === 'buff') p.push({ regen: `毎tick最大HPの${s.val * 100}%回復`, def: `魔法防御+${s.val * 100}%`, atk: `魔法攻撃+${s.val * 100}%` }[s.stat] + `（${s.dur}tick）`);
  else if (s.t === 'debuff') p.push({ acc: `相手の精度${s.val}`, def: `相手の魔法防御${s.val * 100}%` }[s.stat] + `（${s.dur}tick）`);
  return `CT${s.ct}・` + p.join('・');
}

// ===== 属性適性 =====
// 主適性＝入学時に決まる生まれ持った属性、サブ適性＝パートナーの属性。
// 主とサブが同じ属性なら「純化」として主適性の効果が強まる。
const AFF = {
  research: { main: 3, sub: 2 },            // 研究の3択での出やすさ（倍率）
  power: { main: 0.10, sub: 0.05, pure: 0.15 }, // その属性の魔法の威力
  attempt: { main: 0.15, sub: 0.10 },       // その属性の魔法の習得チャレンジ成功率（加算）
  synergyNeed: { main: 2, other: 3 },       // 属性共鳴に必要な装備数
  grow: 0.05,                               // 主適性に対応するステータスの成長（授業）
};
// ===== 属性相性 =====
// 火→木→水→火 の三すくみ、光と闇は互いに弱点。有利なら×strong、不利なら×weak。
// 守る側の属性＝主適性（敵は各自の属性）。サブ適性は「自分が有利をとる属性」からの弱点を打ち消す。
const BEATS = { fire: 'wood', wood: 'water', water: 'fire', light: 'dark', dark: 'light' };
const MATCH = { strong: 1.2, weak: 0.85 };
// atkEl の攻撃が、守る側 def = { el, aff } に与える倍率
function matchMul(atkEl, def) {
  if (!atkEl || !def || !def.el) return 1;
  let m = 1;
  if (BEATS[atkEl] === def.el) m = MATCH.strong;
  else if (BEATS[def.el] === atkEl) m = MATCH.weak;
  if (m > 1 && def.aff) {           // 弱点の打ち消し：サブ適性（や2つ目の主適性）がその攻撃属性に有利なら等倍に
    const covers = [def.aff.sub, ...def.aff.main.filter(e => e !== def.el)].filter(Boolean);
    if (covers.some(e => BEATS[e] === atkEl)) m = 1;
  }
  return m;
}
// 画面向けの説明（相手の属性 el に対して）
function matchupInfo(el) {
  const strongVs = Object.keys(BEATS).filter(a => BEATS[a] === el);             // el に強い属性
  const weakVs = Object.keys(BEATS).filter(a => BEATS[el] === a && BEATS[a] !== el);  // el の攻撃に弱い属性
  return { strongVs, weakVs: [BEATS[el]] };
}

// 属性ごとに伸びやすいステータス（主適性の成長補正の対象。数字は配分）
const ELEM_STAT = { fire: { atk: 1 }, water: { acc: 1 }, wood: { hp: 0.5, def: 0.5 }, light: { int: 1 }, dark: { atk: 0.5, acc: 0.5 } };
// aff = { main: [属性…], sub: 属性|null }
function affOf(s) { return { main: s.affinity, sub: s.sub || null }; }
function affRole(aff, el) { if (!aff || !el) return null; if (aff.main.includes(el)) return aff.sub === el ? 'pure' : 'main'; return aff.sub === el ? 'sub' : null; }
function affPower(aff, el) { const r = affRole(aff, el); return 1 + (r ? AFF.power[r] : 0); }
function synNeed(aff, el) { return aff && aff.main.includes(el) ? AFF.synergyNeed.main : AFF.synergyNeed.other; }
function synergyOf(aff, elems) { const c = {}; elems.forEach(e => { if (e) c[e] = (c[e] || 0) + 1; }); return Object.keys(c).filter(k => c[k] >= synNeed(aff, k)); }

const PASSIVES = {

const COMMON_PASSIVES = ['focus', 'guts', 'quick', 'flow', 'wall', 'adversity', 'hard', 'sleep', 'charm', 'scholar', 'tough', 'sniper'];

// ---- 人物 ----
// 人物は2つのグループに分かれる（GROUPS）。
//   star  … 五星（いつつぼし）：各属性に1人ずつの同級生。絆100で1人だけ「盟友」になれる。卒業大会の決勝の相手にもなる

// ===== 生徒生成 =====
function newStudent(name, forceOrigin) {
  const oid = forceOrigin || wpick(Object.keys(ORIGINS), k => ORIGINS[k].p).toString();
  const o = ORIGINS[oid];
  const s = { name, origin: oid, stats: {}, grow: {}, fatigue: 0, cond: 2, turn: 1,
    spells: [], equip: [], passives: [], partner: null, sub: null, absent: {}, research: 0, bonds: Object.fromEntries(Object.keys(CHARS).map(k => [k, 0])), pending: [],
    flags: {}, talents: [], results: {}, log: [] };
  for (const k of STATS) s.stats[k] = Math.round(o.init[k] * (0.92 + rnd() * 0.16));
  if (oid === 'orphan') {
    const t = [...STATS].sort(() => rnd() - 0.5).slice(0, 2); s.talents = t;
    for (const k of STATS) s.grow[k] = t.includes(k) ? 1.45 : 0.9;
  } else s.grow = { ...o.grow };
  // 属性適性
  s.affinity = [pick(ELEMS)];
  if (oid === 'heir') { let e2; do e2 = pick(ELEMS); while (e2 === s.affinity[0]); s.affinity.push(e2); }
  // 初期魔法: 適性属性の基本魔法1つ（貴族は2つ）
  const firstPool = SPELLS.filter(x => s.affinity.includes(x.el) && !x.rare && x.t === 'dmg');
  addSpell(s, pick(firstPool).id);
  if (oid === 'noble') addSpell(s, pick(SPELLS.filter(x => !x.rare && !s.spells.find(y => y.id === x.id))).id);
  return s;
}

function slots(s) { return clamp(2 + Math.floor(s.stats.int / 40), 2, 7); }

function addSpell(s, id) {
  const have = s.spells.find(x => x.id === id);
  if (have) { if (have.lv < 5) have.lv++; return { up: true, lv: have.lv }; }
  s.spells.push({ id, lv: 1 });
  if (s.equip.length < slots(s)) s.equip.push(id);
  return { up: false };
}
function addPassive(s, id) {
  if (s.passives.includes(id)) return false;
  s.passives.push(id);
  // 別の経路で手に入れた場合も、挑戦中リストから片づける
  if (s.pending) s.pending = s.pending.filter(a => !(a.kind === 'passive' && a.id === id));
  return true;
}
function has(s, id) { return s.passives.includes(id); }

// 主適性に対応するステータスの授業成長補正
function affGrow(s, k) { let w = 0; for (const e of s.affinity) w += (ELEM_STAT[e][k] || 0); return 1 + AFF.grow * w; }
function growMul(s) { return COND_MUL[s.cond] * (has(s, 'commoner_grit') ? 1.1 : 1); }
// ステータスを増減する。内部は小数で保持し、戻り値は表示上（整数）の変化量。
// 知力が下がって装備枠が減った場合は、後ろに装備した魔法から外す（装備数が枠を超えないように）。
function gain(s, k, v) {
  const b = s.stats[k]; s.stats[k] = Math.max(1, b + v);
  if (k === 'int' && s.equip) while (s.equip.length > slots(s)) s.equip.pop();
  return Math.round(s.stats[k]) - Math.round(b);
}

function fmtGain(obj) {
  return Object.entries(obj).filter(([, v]) => v).map(([k, v]) => `${STAT_NAME[k]}${v > 0 ? '+' : ''}${v}`).join(' / ');
}

function doTrain(s, stat) {
  const out = { kind: 'train', lines: [] };
  if (rnd() * 100 < failRate(s)) {
    s.cond = Math.max(0, s.cond - 1);
    s.fatigue = clamp(s.fatigue + 10, 0, 100);
    let t = `${SUBJECT[stat]}の授業で無理をして失敗した…（調子ダウン）`;
    if (rnd() < 0.35) { const d = gain(s, stat, -3 * (stat === 'hp' ? 3 : 1)); t += ` ${STAT_NAME[stat]}${d}`; }
    out.lines.push(t); out.fail = true; out.events = [{ title: '授業に失敗…', text: t, bad: true }]; return out;
  }
  const spc = specialOf(s.turn); const camp = !!(spc && spc.trainMul); const cmul = camp ? spc.trainMul : 1;
  const spread = s.origin === 'commoner' ? [3.2, 3.7] : [2.8, 4.1];   // 週あたりの成長量（月単位版と総量が揃うよう調整）
  let base = (spread[0] + rnd() * (spread[1] - spread[0])) * (has(s, 'hard') ? 1.15 : 1) * cmul;
  const g = {};
  const mul = (k) => (k === 'hp' ? 3 : 1) * s.grow[k] * growMul(s) * affGrow(s, k);
  g[stat] = gain(s, stat, base * mul(stat));
  // 副次成長
  const side = { hp: 'def', atk: 'acc', int: 'acc', def: 'hp', acc: 'int' }[stat];
  g[side] = gain(s, side, (0.65 + rnd() * 0.4) * mul(side) * cmul);
  s.fatigue = clamp(s.fatigue + (camp ? spc.trainFatigue : 22) * (has(s, 'tough') ? 0.75 : 1), 0, 100);
  out.lines.push(`${camp ? '【夏合宿】' : ''}${SUBJECT[stat]}の${camp ? '特訓' : '授業'}を受けた。${fmtGain(g)}`);
  out.events = cmdEvents(s, 'train', stat);
  return out;
}

// ---- 研究：3つの候補から1つを選ぶ ----
function researchOffer(s) {
  const rareW = (has(s, 'scholar') ? 0.9 : 0.35) + (s.origin === 'heir' ? 0.3 : 0) + s.stats.int / 600;
  const pool = [...SPELLS]; const out = [];
  while (out.length < 3 && pool.length) {
    const sp = wpick(pool, x => { const h = s.spells.find(y => y.id === x.id); if (h && h.lv >= 5) return 0.0001; const r = affRole(affOf(s), x.el); return (r === 'main' || r === 'pure' ? AFF.research.main : r === 'sub' ? AFF.research.sub : 1) * (x.rare ? rareW : 1) * (h ? 0.7 : 1); });
    out.push(sp.id); pool.splice(pool.indexOf(sp), 1);
  }
  return out;
}
function doResearch(s) {
  const out = { kind: 'research', lines: [] };
  s.fatigue = clamp(s.fatigue + 16 * (has(s, 'tough') ? 0.75 : 1), 0, 100);
  if (rnd() * 100 < failRate(s) * 0.8) { s.cond = Math.max(0, s.cond - 1); out.lines.push('研究に集中できず、成果は出なかった…（調子ダウン）'); out.fail = true; out.events = [{ title: '研究が行き詰まった', text: '疲れで集中できず、成果は出なかった…', bad: true }]; return out; }
  const inc = Math.round(ri(24, 34) + s.stats.int / 15);
  s.research += inc;
  const di = gain(s, 'int', (1 + rnd()) * s.grow.int * growMul(s) * 0.4);
  if (s.research >= 100) { s.research -= 100; out.offer = researchOffer(s); }
  else out.lines.push(`研究を進めた。進捗 ${s.research}%（+${inc}%） 知力+${di}`);
  out.events = cmdEvents(s, 'research');
  return out;
}
function learnChoice(s, id) {
  const sp = SPELL[id]; const r = addSpell(s, id);
  const di = gain(s, 'int', (1 + rnd()) * s.grow.int * growMul(s));
  return r.up ? `研究で【${sp.n}】の理解が深まった！（Lv${r.lv}） 知力+${di}`
    : `新魔法【${sp.n}】（${ELEM[sp.el].n}${sp.rare ? '・レア' : ''}）を習得した！ 知力+${di}`;
}

// ---- 選択式イベントの共通処理 ----
function mkEvent(title, text, choices, extra) { return { title, text, choices, ...(extra || {}) }; }
function resolveChoice(s, ev, i) {
  const c = ev.choices[i]; const a = snap(s); const r = c.fn(s);
  const o = typeof r === 'string' ? { text: r } : r;
  return { title: ev.title, choice: c.label, ...o, diff: diffSnap(a, snap(s)) };
}
function hintOf(s, c) { return typeof c.hint === 'function' ? c.hint(s) : c.hint; }
// 絆の上限：絆40・80の節目は、その出来事が起きるまで越えられない（出来事は、能力が目安に届くと起きる）
function bondCap(s, k) {
  const f = s.flags;
  if (!f['b40' + k]) return 40;
  if (!f['b80' + k]) return 80;
  return 100;
}
function addBond(s, k, v) {
  if (v > 0) v = Math.round(v * (has(s, 'charm') ? 1.5 : 1) * (has(s, 'noble_blood') ? 1.15 : 1));
  s.bonds[k] = clamp(s.bonds[k] + v, 0, Math.max(bondCap(s, k), s.bonds[k]));
}
function statHint(k, v) { return `${STAT_NAME[k]}+${k === 'hp' ? v * 3 : v}`; }

// ---- 習得チャレンジ（確率制・失敗しても再挑戦できる） ----
// att: { kind:'passive'|'spell', id, base(基本成功率), src(再挑戦のきっかけになる人物), retryText }
function attKey(att) { return (att.kind === 'passive' ? 'p:' : 's:') + att.id; }
function attName(att) { return att.kind === 'passive' ? `特性【${PASSIVES[att.id].n}】` : `魔法【${SPELL[att.id].n}】`; }
function attFails(s, att) { const e = s.pending.find(x => x.key === attKey(att)); return e ? e.fails : 0; }
// 進行ロック：絆40・80の節目は、その人の得意ステータスが目安に届くまで越えられない（体力は3倍）
const NEED = { 40: 110, 80: 170 };
function needFor(cid, lv) { return NEED[lv] * (CHARS[cid].stat === 'hp' ? 3 : 1); }
function statReady(s, cid, lv) { return s.stats[CHARS[cid].stat] >= needFor(cid, lv); }
function attemptRate(s, att) {
  const bonus = att.id === 'noir_bless' && s.flags.noirFed ? 0.2 : 0;
    const r = att.kind === 'spell' ? affRole(affOf(s), SPELL[att.id].el) : null;
  const ab = r === 'sub' ? AFF.attempt.sub : r ? AFF.attempt.main : 0;   // 適性属性の魔法は習得しやすい
  return clamp(att.base + 0.2 * attFails(s, att) + (s.cond - 2) * 0.08 + bonus + ab, 0.1, 0.95);
}
function attemptHint(att, pre) {
  return (s) => `${pre ? pre + '・' : ''}${attName(att)}${att.kind === 'passive' ? '：' + PASSIVES[att.id].d : '：' + spellDesc(SPELL[att.id])}・成功率${Math.round(attemptRate(s, att) * 100)}%${attFails(s, att) ? `（コツLv${attFails(s, att)}）` : ''}`;
}
// 挑戦中リストに登録（既にあれば何もしない）して、その項目を返す
function addPending(s, att) {
  const key = attKey(att);
  let e = s.pending.find(x => x.key === key);
  if (!e) { e = { ...att, key, fails: 0 }; s.pending.push(e); }
  return e;
}
function tryLearn(s, att) {
  const key = attKey(att); const p = attemptRate(s, att); const name = attName(att);
  if (rnd() < p) {
    s.pending = s.pending.filter(x => x.key !== key);
    const say = att.okText ? att.okText + '\n' : '';
    if (att.kind === 'passive') { addPassive(s, att.id); return { text: `${say}成功！ ${name}を習得した！`, passive: att.id, big: true, ok: true }; }
    const r = addSpell(s, att.id);
    return { text: `${say}成功！ ${name}${r.up ? 'の理解が深まった（Lv' + r.lv + '）' : 'を習得した'}！`, spell: att.id, big: true, ok: true };
  }
  const e = addPending(s, att);
  e.fails++;
  return { text: `失敗…。でも手応えはあった。次に挑戦するときは、もっと成功しやすくなる。`, bad: true };
}
function attemptChoice(att, label, pre, costFn) {
  return { label, hint: attemptHint(att, pre), fn: s => { const r = tryLearn(s, att); if (costFn) costFn(s); return r; } };
}
function retryEvent(s, a) {
  return mkEvent(`再挑戦：${attName(a)}`, a.retryText || `以前つかみ損ねた${attName(a)}。今度こそ…！`, [
    attemptChoice(a, '挑戦する', '疲労+8', s => { s.fatigue = clamp(s.fatigue + 8, 0, 100); }),
    { label: '今回は見送る', hint: 'また次の機会に', fn: () => 'また次の機会を待つことにした。' },
  ], { retry: true });
}
function cleanPending(s) {
  s.pending = (s.pending || []).filter(a => a.kind === 'passive' ? !has(s, a.id) : ((s.spells.find(y => y.id === a.id) || {}).lv || 0) < 5);
}

// ---- 効果をデータで書くための仕組み ----
const FX_NAME = { fatigue: '疲労', research: '研究進捗' };
function applyFx(s, fx, cid) {
  for (const [k, v] of Object.entries(fx)) {
    if (STATS.includes(k)) gain(s, k, v);
    else if (k === 'fatigue') s.fatigue = clamp(s.fatigue + v, 0, 100);
    else if (k === 'cond') s.cond = clamp(s.cond + v, 0, 4);
    else if (k === 'bond') addBond(s, cid, v);
    else if (k === 'bondAll') for (const b in s.bonds) addBond(s, b, v);
    else if (k === 'research') s.research += v;
  }
}
function fxHint(fx, cid) {
  return Object.entries(fx).map(([k, v]) => {
    if (k === 'cond') return v > 0 ? '調子↑' : '調子↓';
    if (k === 'bond') return `${CHARS[cid].n}との絆+${v}`;
    if (k === 'bondAll') return `全員との絆+${v}`;
    const n = STAT_NAME[k] || FX_NAME[k]; return `${n}${v > 0 ? '+' : ''}${v}${k === 'research' ? '%' : ''}`;
  }).join('・');
}
function fxChoice(label, fx, res, cid, after) {
  return { label, hint: s => fxHint(fx, cid) + (fx.bond && s && s.bonds[cid] >= bondCap(s, cid) ? `（${CHARS[cid].n}との絆は🔒で止まっている）` : ''), fn: s => { applyFx(s, fx, cid); if (after) after(s); return res; } };
}

// ---- 交流 ----
// 週ごとの在・不在。各キャラの busy（毎月決まった週は不在）と absent（ランダムな不在理由）、
// シナリオの availability（不在率・最低人数・特別期間に来る人）で決まる。結果は s.absent{人物: 理由|null}
function rollAvailability(s) {
  const av = SC.availability; const w = weekOf(s.turn); const sp = specialOf(s.turn);
  const res = {}; const randomAbsent = [];
  for (const k of Object.keys(CHARS)) {
    const c = CHARS[k]; let reason = null;
    const inSpecial = sp && av.special && av.special[sp.id];   // 特別期間中は、参加者の決まった予定はなし（みな合宿所にいる）
    if (!isUnlocked(s, k)) reason = `${c.fromMonth > 12 ? Math.ceil(c.fromMonth / 12) + '年目' : ''}から登場`;
    else if (inSpecial && !av.special[sp.id].includes(k) && s.partner !== k) reason = `${sp.name}には来ていない`;
    else if (!inSpecial && c.busy && c.busy.week === w) reason = c.busy.reason;
    else if (rnd() < (s.partner === k ? av.partnerRate : (c.absentRate != null ? c.absentRate : av.rate))) { reason = pick(c.absent); randomAbsent.push(k); }
    res[k] = reason;
  }
  // 会える人が少なすぎる週は、ランダムな不在から順に取り消す
  while (Object.values(res).filter(r => !r).length < av.minPresent && randomAbsent.length) res[randomAbsent.splice(Math.floor(rnd() * randomAbsent.length), 1)[0]] = null;
  s.absent = res;
}
// 画面向け：能力が足りずに節目で止まっているなら { level, stat, need, cur } を返す
function lockInfo(s, cid) {
  const f = s.flags, b = s.bonds[cid];
  const lv = b >= 40 && !f['b40' + cid] ? 40 : b >= 80 && !f['b80' + cid] ? 80 : 0;
  if (!lv || statReady(s, cid, lv)) return null;
  const c = CHARS[cid];
  return { level: lv, stat: c.stat, need: needFor(cid, lv), cur: Math.round(s.stats[c.stat]) };
}
// 画面向け：その人との「関係の壁」（絆40・80を越えるのに必要な能力）の一覧
//   state: 'passed'＝もう越えた / 'ready'＝能力は届いている / 'short'＝まだ足りない
function gateInfo(s, cid) {
  const c = CHARS[cid], cur = Math.round(s.stats[c.stat]);
  return { stat: c.stat, cur, gates: [40, 80].map(lv => ({ lv, need: needFor(cid, lv),
    state: s.flags['b' + lv + cid] ? 'passed' : cur >= needFor(cid, lv) ? 'ready' : 'short' })) };
}
// 節目で止まったときの案内（その節目につき1回だけ）
function lockNotice(s, cid, lv) {
  const f = s.flags, c = CHARS[cid];
  if (f['n' + lv + cid]) return [];
  f['n' + lv + cid] = 1;
  return [{ title: `🔒 ${c.n}との絆`, text: `${c.n}との関係を、ここから先へ深めるには力が足りないようだ。\n${STAT_NAME[c.stat]}を${needFor(cid, lv)}まで鍛えれば、関係が深まりそうだ（いま${Math.round(s.stats[c.stat])}）。`, char: cid }];
}
// 盟友になれる相手か（五星のみ）
function canPartner(cid) { return CHARS[cid].group === 'star'; }
// もう出会っているか（後輩は2年目から）
function isUnlocked(s, cid) { const m = CHARS[cid].fromMonth; return !m || monthIdx(s.turn) >= m; }
// 今週交流できる相手
function socialTargets(s) { return Object.keys(CHARS).filter(k => !(s.absent && s.absent[k])); }
// 交流相手の選択画面に出す「次に起きること」
function bondNext(s, cid) {
  const b = s.bonds[cid], c = CHARS[cid], star = c.group === 'star';
  if (s.partner === cid) return '盟友';
  const li = lockInfo(s, cid);
  if (li) return `🔒 ${STAT_NAME[li.stat]}が${li.need}になると関係が深まる（いま${li.cur}）`;
  const f = s.flags, soon = '（まもなく）';
  if (b < 20) return `絆20：物語「${CHAR_STORY[cid].s20.title}」`;
  if (!f['b40' + cid]) return `絆40：特性【${PASSIVES[c.p40].n}】に挑戦${b >= 40 ? soon : ''}`;
  if (b < 60) return `絆60：物語「${CHAR_STORY[cid].s60.title}」`;
  if (!f['b80' + cid]) return `絆80：秘伝魔法【${SPELLS.find(x => x.el === c.el && x.rare).n}】に挑戦${b >= 80 ? soon : ''}`;
  if (!star) return b < 100 ? `絆100：餞別（特性【${PASSIVES[c.seal].n}】）` : '絆は最大';
  if (b < 100) return s.partner ? '絆100：かけがえのない友' : '絆100：盟友の誓い';
  if (!s.partner) return '盟友の誓いを立てられる';
  return '絆は最大';
}
function storyEvent(s, cid, key) {
  const st = CHAR_STORY[cid][key];
  return mkEvent(`${CHARS[cid].n}：${st.title}`, st.text,
    st.choices.map((ch, i) => fxChoice(ch.label, ch.fx, ch.res, cid, s => { s.flags[key + cid] = i + 1; })), { char: cid, big: key === 's60' });
}
// ---- 絆の節目（20物語・40特性・60物語・80秘伝・100誓い/餞別） ----
// 交流でもイベントでも、絆が節目を越えたらここで出来事を作る。flags で一度きりにしている。
// fromSocial：交流の最中か（盟友の誓いを保留したとき、次の交流であらためて申し込まれるようにするため）
function milestoneEvents(s, cid, fromSocial) {
  const c = CHARS[cid], f = s.flags, b = s.bonds[cid], out = [];
  if (!isUnlocked(s, cid)) return out;
  if (b >= 20 && !f['s20' + cid]) { f['s20' + cid] = 1; out.push(storyEvent(s, cid, 's20')); }
  if (b >= 40 && !f['b40' + cid] && !statReady(s, cid, 40)) out.push(...lockNotice(s, cid, 40));
  else if (b >= 40 && !f['b40' + cid]) {
    f['b40' + cid] = 1;
    const att = { kind: 'passive', id: c.p40, base: 0.6, src: cid, retryText: `${c.n}：${c.retry}` };
    out.push(mkEvent(`${c.n}との絆 ★`, `${c.n}との距離がぐっと縮まった。\n${c.n}：${c.b40}`, [
      attemptChoice(att, `${c.n}の教えを受ける`),
      { label: '一緒に特訓する', hint: `${statHint(c.stat, 12)}・疲労+8（確実）`, fn: s => { gain(s, c.stat, c.stat === 'hp' ? 36 : 12); s.fatigue = clamp(s.fatigue + 8, 0, 100); return `${c.n}と日が暮れるまで特訓した。`; } },
    ], { char: cid }));
  }
  if (b >= 60 && !f['s60' + cid]) { f['s60' + cid] = -1; out.push(storyEvent(s, cid, 's60')); }
  if (b >= 80 && !f['b80' + cid] && !statReady(s, cid, 80)) out.push(...lockNotice(s, cid, 80));
  else if (b >= 80 && !f['b80' + cid]) {
    f['b80' + cid] = 1;
    const rs = SPELLS.find(x => x.el === c.el && x.rare);
    const att = { kind: 'spell', id: rs.id, base: 0.5, src: cid, retryText: `${c.n}：${c.retry}` };
    out.push(mkEvent(`${c.n}の秘伝`, `${c.n}：${c.secret}`, [
      attemptChoice(att, '秘伝の修行を受ける', '疲労+10', s => { s.fatigue = clamp(s.fatigue + 10, 0, 100); }),
      { label: 'まだ早いと辞退する', hint: '調子↑（また機会はある）', fn: s => { s.cond = Math.min(4, s.cond + 1); addPending(s, att); return 'もっと力をつけてから、と約束した。'; } },
    ], { big: true, char: cid }));
  }
  // 絆100：五星 → 盟友の誓い（いつでも・1周に1人）／盟友が別にいれば「かけがえのない友」。どちらも絆100特性（p80）
  //        イベント → 餞別（固有の特性＋全ステータス＋得意ステータス）
  if (b >= 100 && !f['b100' + cid]) {
    const st = CHAR_STORY[cid];
    if (c.group === 'event') {
      const sp = PASSIVES[c.seal];
      out.push(mkEvent(`${c.n}からの餞別`, `${c.n}との絆が最大になった。\n${c.n}：${c.farewell}`, [
        { label: 'ありがたく受け取る', hint: `特性【${sp.n}】：${sp.d}・全ステータス+5・${statHint(c.stat, 10)}`, fn: s => {
          f['b100' + cid] = 1; addPassive(s, c.seal);
          for (const k of STATS) gain(s, k, k === 'hp' ? 15 : 5);
          gain(s, c.stat, c.stat === 'hp' ? 30 : 10);
          return { text: `${c.n}から、心のこもった餞別を受け取った。`, passive: c.seal, big: true };
        } },
      ], { char: cid, big: true }));
    } else if (s.partner && s.partner !== cid) {
      const pn = PASSIVES[c.p80];
      out.push(mkEvent(`${c.n}：かけがえのない友`, `${c.n}との絆が最大になった。\n${c.n}：${c.b80}`, [
        { label: 'これからもよろしく', hint: `特性【${pn.n}】：${pn.d}・調子↑`, fn: s => {
          f['b100' + cid] = 1; addPassive(s, c.p80); s.cond = clamp(s.cond + 1, 0, 4);
          return { text: `${c.n}と、これからも変わらぬ友情を誓った。`, passive: c.p80 };
        } },
      ], { char: cid }));
    } else if (!s.partner && (fromSocial || !f['oath' + cid])) {
      f['oath' + cid] = 1;   // 交流以外で申し込まれるのは最初の1回だけ（保留したら、次の交流で）
      const pn = PASSIVES[c.p80];
      out.push(mkEvent(`${c.n}：盟友の誓い`, st.oath, [
        { label: '誓いを立てる', hint: `${c.n}が盟友に（1周に1人だけ）・サブ適性【${ELEM[c.el].n}】を獲得・特性【${pn.n}】：${pn.d}`, fn: s => {
          s.partner = cid; s.sub = c.el; f['b100' + cid] = 1; addPassive(s, c.p80);
          return { text: `${c.n}と、盟友の誓いを立てた。\n${ELEM[c.el].n}の力が、自分の中に流れ込んでくる――サブ適性【${ELEM[c.el].n}】を得た。`, passive: c.p80, big: true };
        } },
        { label: '今はまだ答えられない', hint: `また${c.n}と交流したときに、あらためて誓いを立てられる`, fn: () => st.wait },
      ], { big: true, char: cid }));
    }
  }
  return out;
}

// ---- 交流 ----
function doSocial(s, cid) {
  const out = { kind: 'social', lines: [], events: [] };
  s.fatigue = clamp(s.fatigue + 6, 0, 100);
  if (rnd() < 0.15) s.cond = Math.min(4, s.cond + 1);
  if (!cid || !socialTargets(s).includes(cid)) cid = pick(socialTargets(s));   // 指定がない・不在の相手なら、会える人からランダム（画面からは起きない）
  const c = CHARS[cid];
  // 交流で上がる絆は控えめ（絆の主な伸びは五星とのランダムイベント）。イベントの人物は交流が主な手段なので多め
  const bFrom = s.bonds[cid];
  addBond(s, cid, c.group === 'event' ? ri(4, 6) : ri(3, 4));
  const g = {}; g[c.stat] = gain(s, c.stat, (0.8 + rnd() * 0.6) * (c.stat === 'hp' ? 3 : 1) * s.grow[c.stat] * growMul(s) * (c.group === 'event' ? EVENT_GAIN : 1));
  const place = pick(c.where); const line = pick(c.talk);
  out.lines.push(`${place}で${c.n}（${c.role}）と過ごした。${c.n}：${line} ${fmtGain(g)}（絆 ${bFrom}→${s.bonds[cid]}）`);
  // 交流そのものを毎回ポップアップで見せる（ステータス変化はUI側で行動全体の差分を添付）
  out.events.push({ title: `${c.n}と交流`, text: `${place}で、${c.n}と過ごした。\n${c.n}：${line}`, char: cid, bond: { k: cid, from: bFrom, to: s.bonds[cid] } });
  cleanPending(s);
  const ms = milestoneEvents(s, cid, true);
  out.events.push(...ms);
  // 節目の出来事がなければ、つかみ損ねた技・特性に再挑戦できることがある
  if (!ms.length) {
    const pend = s.pending.filter(a => a.src === cid);
    if (pend.length && rnd() < 0.3) out.events.push(retryEvent(s, pick(pend)));
  }

  if (!isQuiet(s) && s.origin === 'noble' && rnd() < 0.08) {

    out.events.push(mkEvent('【貴族】サロンへの招待', '名家のサロンから招待状が届いた。', [
      { label: '社交に励む', hint: '全員との絆+6・知力+5・魔法防御+5・疲労+10', fn: s => { for (const k in s.bonds) addBond(s, k, 6); gain(s, 'int', 5); gain(s, 'def', 5); s.fatigue = clamp(s.fatigue + 10, 0, 100); return '顔を広げ、有益な話もたくさん聞けた。'; } },
      { label: '顔だけ出して早めに帰る', hint: '疲労-10・調子↑', fn: s => { s.fatigue = clamp(s.fatigue - 10, 0, 100); s.cond = Math.min(4, s.cond + 1); return '挨拶だけ済ませ、ゆっくり休んだ。'; } },
    ]));
  }
  if (!isQuiet(s) && rnd() < 0.04) {
    const cand = COMMON_PASSIVES.filter(p => !has(s, p)).sort(() => rnd() - 0.5).slice(0, 2);
    if (cand.length) out.events.push(mkEvent('ひらめき', '何気ない会話の中で、大切なことに気づけそうだ。どちらをものにする？',
      cand.map(p => attemptChoice({ kind: 'passive', id: p, base: 0.5, src: cid, retryText: '以前のひらめきが、また頭をよぎった。' }, `【${PASSIVES[p].n}】を意識する`))));
  }
  return out;
}


function doRest(s) {
  const out = { kind: 'rest', lines: [] };
  const amt = 45 + (has(s, 'sleep') ? 15 : 0);
  s.fatigue = clamp(s.fatigue - amt, 0, 100);
  const up = rnd() < (has(s, 'sleep') ? 0.8 : 0.55);
  if (up) s.cond = Math.min(4, s.cond + 1);
  out.lines.push(`しっかり休んだ。疲労-${amt}${up ? '・調子アップ' : ''}`);
  out.events = cmdEvents(s, 'rest');
  return out;
}

// ===== 変化量の記録 =====
function snap(s) { const o = { fatigue: Math.round(s.fatigue), cond: s.cond }; for (const k of STATS) o[k] = Math.round(s.stats[k]); return o; }
function diffSnap(a, b) {
  const d = [];
  for (const k of STATS) if (a[k] !== b[k]) d.push({ k, name: STAT_NAME[k], from: a[k], to: b[k] });
  if (a.fatigue !== b.fatigue) d.push({ k: 'fatigue', name: '疲労', from: a.fatigue, to: b.fatigue, inv: true });
  if (a.cond !== b.cond) d.push({ k: 'cond', name: '調子', from: COND[a.cond], to: COND[b.cond], up: b.cond > a.cond });
  return d;
}

function starEvent(s, c) {
  const stars = Object.keys(CHARS).filter(k => CHARS[k].group === 'star');
  const cid = pick(stars);                                   // 五星から均等に1人
  s.seen = s.seen || {}; const seen = s.seen[cid] = s.seen[cid] || [];
  let cand = STAR_EVENTS[cid].map((_, i) => i).filter(i => !seen.includes(i));
  if (!cand.length) { seen.length = 0; cand = STAR_EVENTS[cid].map((_, i) => i); }   // 全部見たら最初から
  const i = pick(cand); seen.push(i);
  return STAR_EVENTS[cid][i](s, c);
}

// ===== 魔法の性能計算（表示用・戦闘と同じ式） =====
function equipSyn(s) { return synergyOf(affOf(s), s.equip.map(id => SPELL[id].el)); }
function spellStats(s, entry, enemyDef) {
  const sp = entry.id === 'basic' ? BASIC : SPELL[entry.id]; const lv = entry.lv || 1;
  const syn = equipSyn(s); const P = (id) => s.passives.includes(id);
  const lvMul = 1 + 0.12 * (lv - 1);
  const ctRed = Math.min(0.3, s.stats.int / 800) + (P('flow') ? 0.1 : 0);
  const ct = Math.max(1, Math.round((sp.ct - (lv >= 3 ? 1 : 0)) * (1 - ctRed)));
  const potMul = lvMul * (P('heir_blood') ? 1.12 : 1) * (P('seal_ord') ? 1.1 : 1) * affPower(affOf(s), sp.el);
  const def = s.stats.def;
  const r = { sp, lv, ct, baseCt: sp.ct, pow: +(sp.pow ? sp.pow * potMul : 0).toFixed(2) };
  if (sp.t === 'dmg') {
    let atk = s.stats.atk * (P('seal_celia') ? 1.1 : 1) * sp.pow * potMul + (sp.defScale ? def * sp.defScale : 0);
    if (syn.includes('fire')) atk *= 1.10;
    r.hit = Math.round(atk * 100 / (100 + enemyDef));
    r.hits = sp.hits || 1;
    r.total = r.hit * r.hits + (sp.burn ? Math.round(s.stats.atk * sp.burn * 100 / (100 + enemyDef)) * 4 : 0);
    r.perTick = +(r.total / ct).toFixed(1);
  } else if (sp.t === 'heal') {
    let h = s.stats.hp * sp.val * potMul + s.stats.int * 0.4; if (syn.includes('light')) h *= 1.3; r.heal = Math.round(h);
  } else if (sp.t === 'shield') {
    let v = def * sp.val * potMul + 15; r.shield = Math.round(v);
  }
  return r;
}
function nextEnemyDef(turn) { return SC.nextEnemyDef(monthIdx(turn)); }


// ===== 戦闘 =====
function makeFighter(name, stats, spells, equip, passives, el, aff) {
  stats = Object.fromEntries(Object.entries(stats).map(([k, v]) => [k, Math.round(v)]));
  const eqSp = equip.map(id => { const sp = spells.find(x => x.id === id); return { ...SPELL[id], lv: sp ? sp.lv : 1 }; });
  const syn = synergyOf(aff, eqSp.map(x => x.el));
  const P = (id) => passives.includes(id);
  let ctRed = Math.min(0.3, stats.int / 800) + (P('flow') ? 0.1 : 0);
  const slotsArr = [...eqSp, BASIC].map(sp => {
    const lvMul = 1 + 0.12 * ((sp.lv || 1) - 1);
    const ct = Math.max(1, Math.round((sp.ct - ((sp.lv || 1) >= 3 ? 1 : 0)) * (1 - ctRed)));
    return { sp, lvMul, ct, cd: P('quick') ? 0 : Math.ceil(ct / 2) };
  });
  const mhp = Math.round(stats.hp * (P('bulwark') ? 1.15 : 1) * (P('seal_garde') ? 1.1 : 1));
  return { name, el, aff, base: { ...stats }, maxHp: mhp, hp: mhp, shield: 0, slots: slotsArr, syn, passives,
    buffs: [], burn: 0, burnT: 0, healCount: 0, gutsUsed: false, P };
}

function eff(f, k) {
  let v = f.base[k];
  if (k === 'acc') { if (f.P('focus')) v += 15; if (f.syn.includes('water')) v += 10; if (f.P('seal_luka')) v += 12; }
  if (k === 'atk' && f.P('seal_celia')) v *= 1.1;
  if (k === 'def' && f.P('seal_garde')) v *= 1.1;
  for (const b of f.buffs) {
    if (b.stat !== k) continue;
    if (k === 'acc') v += b.val; else v *= (1 + b.val);
  }
  return Math.max(1, v);
}
const buffVal = (f, stat) => f.buffs.filter(b => b.stat === stat).reduce((a, b) => a + b.val, 0);

function battle(A, B, maxT = 80) {
  const log = [];
  const push = (e) => log.push({ ...e, hA: Math.max(0, Math.round(A.hp)), hB: Math.max(0, Math.round(B.hp)), sA: Math.round(A.shield), sB: Math.round(B.shield) });
  for (const f of [A, B]) if (f.intro) push({ t: 0, who: f.name, text: f.intro, kind: 'buff' });
  for (const f of [A, B]) if (f.P('intel')) { const o = f === A ? B : A; o.slots.forEach(x => x.cd += 1); push({ t: 0, who: f.name, text: `${f.name}の情報戦！ ${o.name}の詠唱が遅れる（CT+1）`, kind: 'debuff' }); }
  for (let t = 1; t <= maxT; t++) {
    // 精度が高い方が先に動く。同値ならランダム（以前は常に A＝プレイヤーが先で、同値の対戦に偏りがあった）
    const ea = eff(A, 'acc'), eb = eff(B, 'acc');
    const order = ea > eb || (ea === eb && rnd() < 0.5) ? [A, B] : [B, A];
    for (const me of order) {
      const op = me === A ? B : A;
      if (me.hp <= 0 || op.hp <= 0) continue;
      // 継続効果
      if (me.burnT > 0) {
        const d = Math.round(me.burn); dealRaw(me, d); me.burnT--;
        push({ t, who: me.name, text: `${me.name}は${me.burnDrain ? '毒' : '火傷'}で${d}ダメージ`, kind: 'dot' });
        if (me.burnDrain && op.hp > 0) { op.hp = Math.min(op.maxHp, op.hp + d); push({ t, who: op.name, text: `${op.name}は毒から${d}吸収`, kind: 'heal' }); }
        if (me.hp <= 0) break;
      }
      // 再生（世界樹の恵み・自然治癒）
      const rg = buffVal(me, 'regen') + (me.P('regrowth') ? 0.01 : 0);
      if (rg > 0 && me.hp < me.maxHp) { const h = Math.round(me.maxHp * rg); me.hp = Math.min(me.maxHp, me.hp + h); push({ t, who: me.name, text: `${me.name}は再生で${h}回復`, kind: 'heal' }); }
      me.buffs.forEach(b => b.dur--); me.buffs = me.buffs.filter(b => b.dur > 0);
      me.slots.forEach(s => s.cd = Math.max(0, s.cd - 1));
      {
        // 準備完了の魔法のうち、最もCTが長い（重い）魔法を優先。同CTなら装備順
        let ready = null;
        for (const s of me.slots) if (s.cd <= 0 && usable(me, s.sp) && (!ready || s.ct > ready.ct)) ready = s;
        if (ready) { ready.cd = ready.ct; cast(me, op, ready, t, push); }
      }
    }
    if (A.hp <= 0 || B.hp <= 0) break;
  }
  const clean = log.filter(Boolean);
  let win;
  if (A.hp <= 0 && B.hp > 0) win = B; else if (B.hp <= 0 && A.hp > 0) win = A;
  else win = (A.hp / A.maxHp >= B.hp / B.maxHp) ? A : B;
  return { winner: win, log: clean, timeout: A.hp > 0 && B.hp > 0 };
}
function usable(me, sp) {
  if (sp.t === 'heal') return me.hp < me.maxHp * 0.75;
  if (sp.t === 'shield') return me.shield <= 0;
  if (sp.t === 'buff') return !me.buffs.find(b => b.src === sp.id) && (sp.stat !== 'regen' || me.hp < me.maxHp * 0.85);
  return true;
}
function dealRaw(tg, d) {
  if (tg.shield > 0) { const a = Math.min(tg.shield, d); tg.shield -= a; d -= a; }
  tg.hp -= d;
  if (tg.hp <= 0 && tg.P('guts') && !tg.gutsUsed) { tg.hp = 1; tg.gutsUsed = true; return 'guts'; }
  return null;
}
function cast(me, op, slot, t, push) {
  const sp = slot.sp; const E = (x) => ({ t, who: me.name, el: sp.el, ...x });
  const potMul = slot.lvMul * (me.P('heir_blood') ? 1.12 : 1) * (me.P('seal_ord') ? 1.1 : 1) * affPower(me.aff, sp.el);
  if (sp.t === 'dmg') {
    const hits = sp.hits || 1; let total = 0, hitN = 0, crits = 0, gutsMsg = false;
    for (let h = 0; h < hits; h++) {
      const hitRate = clamp(82 + (eff(me, 'acc') - eff(op, 'acc')) * 0.3 + (sp.accB || 0) - buffVal(op, 'eva') - (op.P('swift') ? 12 : 0), 40, 99);
      if (rnd() * 100 >= hitRate) continue;
      hitN++;
      let atk = eff(me, 'atk') * sp.pow * potMul + (sp.defScale ? eff(me, 'def') * sp.defScale : 0);
      const varW = Math.max(4, 20 - eff(me, 'acc') / 10) / 100;
      atk *= 1 + (rnd() * 2 - 1) * varW;
      if (me.syn.includes('fire')) atk *= 1.10;
      if (me.P('adversity') && me.hp < me.maxHp * 0.3) atk *= 1.35;
      if (me.P('orphan_soul') && me.hp < me.maxHp * 0.5) atk *= 1.25;
      const critR = 0.05 + eff(me, 'acc') / 2000 + (sp.crit || 0) + (me.syn.includes('dark') ? 0.1 : 0) + (me.P('sniper') ? 0.1 : 0) + (me.P('noir_bless') ? 0.08 : 0) + (me.P('seal_luka') ? 0.05 : 0);
      if (rnd() < critR) { atk *= 1.8; crits++; }
      let dmg = atk * (100 / (100 + eff(op, 'def'))) * matchMul(sp.el, op);
      if (op.P('wall')) dmg *= 0.9;
      if (op.P('noble_blood')) dmg *= 0.92;
      if (op.P('noir_bless')) dmg *= 0.95;
      if (op.P('orphan_soul') && op.hp < op.maxHp * 0.5) dmg *= 0.85;
      dmg = Math.max(1, Math.round(dmg));
      if (dealRaw(op, dmg) === 'guts') gutsMsg = true;
      total += dmg;
      if (op.hp <= 0) break;
    }
    const mm = matchMul(sp.el, op);
    let text;
    if (!hitN) text = `${me.name}の【${sp.n}】！ しかし外れた`;

// ---------- ターン進行 ----------
function startTurn() {
  if (!S._delta) S._delta = [];
  const evs = turnEvents(S);
  TURNLOG.unshift({ turn: S.turn, lines: [] });
  render();
  if (evs.length) { BUSY = true; processEvents(evs, `${whenOf(S.turn)}のイベント`, () => { BUSY = false; render(); }); }
}
// イベントを順に処理：選択肢があれば選ばせ、結果を表示
function processEvents(list, kicker, done) {
  if (!list.length) { done(); return; }
  const [e, ...rest] = list; const next = () => processEvents(rest, kicker, done);
  if (!e.choices) { showPopups([{ ...e, kicker }], next); return; }
  openModal(`<div class="pop ${e.big ? 'big' : ''}"><div class="kicker">${kicker}${rest.length ? `（このあと${rest.length}件）` : ''}</div>${e.char ? speaker(e.char) : ''}
    <h2>${esc(e.title)}</h2><p class="txt">${esc(e.text)}</p>
    <div class="choices">${e.choices.map((c, i) => `<button class="choice" data-ch="${i}"><span class="cl">${esc(c.label)}</span><span class="ch">${esc(hintOf(S, c))}</span></button>`).join('')}</div></div>`);
  document.querySelectorAll('[data-ch]').forEach(b => b.onclick = () => {
    const res = resolveChoice(S, e, +b.dataset.ch);
    mergeDelta(res.diff);
    TURNLOG[0].lines.push({ t: `${e.title}：「${res.choice}」${res.text}${res.diff.length ? '（' + fmtDiff(res.diff) + '）' : ''}`, c: 'ev' });
    render();
    showPopups([{ title: res.ok ? `${res.choice}――成功！` : res.bad ? `${res.choice}――失敗…` : res.choice, text: res.text, diff: res.diff, spell: res.spell, passive: res.passive, big: res.big, bad: res.bad, kicker: e.title }], next);
  });
}
function researchCard(id) {
  const have = S.spells.find(x => x.id === id); const sp = SPELL[id];
  const entry = { id, lv: have ? Math.min(5, have.lv + 1) : 1 };
  const st = spellStats(S, entry, nextEnemyDef(S.turn));
  const kv = [['威力', sp.pow ? (sp.hits ? `${st.pow}×${sp.hits}` : st.pow) : '―'], ['CT', `${st.ct}tick`]];
  if (st.total != null) kv.push(['予想ダメージ', st.hits > 1 ? `${st.hit}×${st.hits}` : st.total], ['効率', st.perTick]);
  if (st.heal != null) kv.push(['回復量', st.heal]);
  if (st.shield != null) kv.push(['バリア', st.shield]);
  const free = S.equip.length < slots(S);
  const ar = affRole(affOf(S), sp.el);
  const tag = (ar ? `<span class="badge aff">${{ main: '主適性', pure: '純化', sub: 'サブ適性' }[ar]}</span>` : '') + (have ? `<span class="badge up">強化 Lv${have.lv}→${entry.lv}</span>` : `<span class="badge new">新規</span>`);
  const cnt = S.equip.filter(x => SPELL[x].el === sp.el).length;
  const synNote = !have && free && cnt === synNeed(affOf(S), sp.el) - 1 ? `<div class="d" style="color:var(--brass)">装備すると${ELEM[sp.el].n}の属性共鳴が発動（${SYNERGY[sp.el]}）</div>` : '';
  return `<button class="rcard" data-learn="${id}">
    <div>${elChip(sp.el)} ${tag}${sp.rare ? '<span class="badge rare">レア</span>' : ''}</div>
    <div class="n">${sp.n}</div><div class="d">${spellDesc(sp).split('・').filter(t => !/^(CT|威力)/.test(t)).join('・') || '攻撃魔法'}</div>
    <div class="kv">${kv.map(([k, v]) => `<div>${k}<b>${v}</b></div>`).join('')}</div>
    <div class="d" style="margin-top:6px">${have ? (have && S.equip.includes(id) ? '装備中の魔法が強化されます' : '未装備の魔法が強化されます') : (free ? '空き枠に自動で装備されます' : '装備枠が満杯のため控えに入ります')}</div>${synNote}
    <span class="pickl">これを習得する</span></button>`;
}
function showResearch(offer, cb) {
  openModal(`<div class="pop"><div class="kicker">研究</div><h2>研究の成果</h2>
    <p class="txt">3つの魔法の糸口を見つけた。どれを突き詰める？ <span class="note">予想ダメージは次の試験相手への目安</span></p>
    <div class="rgrid">${offer.map(researchCard).join('')}</div></div>`);
  document.querySelectorAll('[data-learn]').forEach(b => b.onclick = () => { closeModal(); cb(b.dataset.learn); });
}
function act(fn) {
  if (BUSY) return;
  BUSY = true; S._delta = [];
  const before = snap(S);
  const eqBefore = [...S.equip];
  const r = fn();
  const afterMain = () => {
    const d = diffSnap(before, snap(S));
    mergeDelta(d);
    TURNLOG[0].lines.push(...r.lines.map(t => ({ t, c: r.fail ? 'bad' : (t.startsWith('★') ? 'ev' : '') })));
    // 知力が下がって装備枠が減ると、はみ出した魔法は自動で外れる。気づけるよう記録に残す
    const dropped = eqBefore.filter(id => !S.equip.includes(id));
    if (dropped.length) TURNLOG[0].lines.push({ t: `装備枠が減ったため【${dropped.map(id => SPELL[id].n).join('】【')}】を外した。魔法タブで付け替えられます。`, c: 'bad' });
    render();
    const evs = (r.events || []).map((e, i) => e.choices ? e : ({ ...e, diff: e.diff || (i === 0 ? d : []) }));
    if (!evs.length && d.length) showToast({ train: isCamp(S.turn) ? '特訓' : '授業', research: '研究', social: '交流', rest: '休息' }[r.kind], d);
    processEvents(evs, { train: '授業', research: '研究', social: '交流', rest: '休息' }[r.kind], () => {
      BUSY = false;
      const ex = examAt(S.turn);
      render();
      if (ex && !ex.tournament) { BUSY = true; setTimeout(() => runExam(ex.key), 250); }
      else if (ex) { BUSY = true; setTimeout(() => runCup(0), 250); }
      else { S.turn++; startTurn(); }
    });
  };
  if (r.offer) { render(); showResearch(r.offer, id => { r.lines.push(learnChoice(S, id)); afterMain(); }); }
  else afterMain();
}

function spellTable() {

  const best = Math.max(...rows.filter(r => r.st.perTick).map(r => r.st.perTick));
  rows.sort((a, b) => (b.eq - a.eq) || ((b.st.perTick || 0) - (a.st.perTick || 0)));

  ${rows.map(({ x, eq, st, basic }) => { const sp = st.sp;
    const pw = sp.pow ? (sp.hits ? `${st.pow}×${sp.hits}` : st.pow) : '―';
    const ctTxt = st.ct !== st.baseCt ? `${st.ct}<small class="note">（${st.baseCt}）</small>` : st.ct;

      <td>${pw}</td><td>${ctTxt}</td><td>${st.total != null ? (st.hits > 1 ? `${st.hit}×${st.hits}` : st.total) : '―'}</td>

let MSG = '';

// ---------- ステータス変化の演出 ----------
// 画面は SHOWN（表示中の値）で描画し、ポップアップが閉じている時に最新値へ動かす。
// これでイベント中に変わった値も、ポップアップを閉じたあとに動いて見える。
let SHOWN = null;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const RANKS = ['G', 'F', 'E', 'D', 'C', 'B', 'A', 'S'];
function barWidths(k, v, dv) {
  const sc = k === 'hp' ? 7.5 : 2.5; const w = Math.min(100, v / sc);
  const gw = dv > 0 ? Math.min(w, dv / sc) : 0;
  return [w - gw, gw];
}
function animateStats() {
  if (!S || !document.querySelector('.stats')) return;
  const cur = snap(S);
  if (!SHOWN) { SHOWN = cur; return; }
  if ($('#ov.show')) return;          // ポップアップ表示中は待つ（閉じたら再実行される）
  const old = SHOWN; SHOWN = cur;
  const ups = [];
  for (const k of STATS) {
    if (old[k] === cur[k]) continue;
    const row = document.querySelector(`.st[data-k="${k}"]`); if (!row) continue;
    const dv = cur[k] - old[k];
    countUp(row.querySelector('.v'), old[k], cur[k]);
    const dd = (S._delta || []).find(x => x.k === k); const tot = dd ? dd.to - dd.from : dv;
    const [bw, gw] = barWidths(k, cur[k], tot);
    row.querySelector('.bar .base').style.width = bw + '%'; row.querySelector('.bar .gain').style.width = gw + '%';
    flash(row, dv > 0 ? 'fl-up' : 'fl-down');
    floatText(row, `${dv > 0 ? '+' : ''}${dv}`, dv > 0 ? 'up' : 'down');
    const g0 = grade(k, old[k]), g1 = grade(k, cur[k]);
    const gEl = row.querySelector('.g');
    if (g0 !== g1) {
      setTimeout(() => { gEl.textContent = g1; flash(gEl, RANKS.indexOf(g1) > RANKS.indexOf(g0) ? 'rankup' : 'rankdown'); }, REDUCED ? 0 : 500);
      if (RANKS.indexOf(g1) > RANKS.indexOf(g0)) ups.push(`${STAT_NAME[k]} ${g0}→${g1}`);
    }
  }
  if (old.fatigue !== cur.fatigue) {
    const row = document.querySelector('[data-k="fatigue"]');
    if (row) { countUp(row.querySelector('.v'), old.fatigue, cur.fatigue); row.querySelector('.bar .base').style.width = cur.fatigue + '%';
      row.classList.toggle('warn', cur.fatigue >= 50 && cur.fatigue < 70); row.classList.toggle('bad', cur.fatigue >= 70);
      floatText(row, `${cur.fatigue > old.fatigue ? '+' : ''}${cur.fatigue - old.fatigue}`, cur.fatigue < old.fatigue ? 'up' : 'down'); }
  }
  if (old.cond !== cur.cond) {
    const row = document.querySelector('[data-k="cond"]');
    if (row) { row.querySelector('.v').textContent = COND[cur.cond]; flash(row, cur.cond > old.cond ? 'fl-up' : 'fl-down'); floatText(row, cur.cond > old.cond ? '▲' : '▼', cur.cond > old.cond ? 'up' : 'down'); }
  }
  if (ups.length) showToast('ランクアップ！', ups.map(t => ({ rank: t })), true);
}
function countUp(el, from, to) {
  if (!el) return;

  const t0 = performance.now(), dur = 700;
  const step = (now) => { const p = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function flash(el, cls) { el.classList.remove('fl-up', 'fl-down', 'rankup', 'rankdown'); void el.offsetWidth; el.classList.add(cls); }
function floatText(row, text, dir) {

  row.appendChild(f); setTimeout(() => f.remove(), 1400);

function showToast(title, diff, special) {

    if (x.rank) return `<span class="chip up">${x.rank}</span>`;
    if (x.k === 'cond') return `<span class="chip ${x.up ? 'up' : 'down'}">調子 ${x.to}${x.up ? '▲' : '▼'}</span>`;

    return `<span class="chip ${good ? 'up' : 'down'}">${x.name} ${v > 0 ? '+' : ''}${v}</span>`;
  }).join('');

  t.innerHTML = `<b>${esc(title)}</b>${chips}`;
  box.appendChild(t); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 3100);
}

// 自分の守り：主適性が守りの属性。弱点と、サブ適性による打ち消し
function defenseInfo(s) {

function breakdown(res, name) {

    const id = e.sid || e.sid2; if (!id) continue;
    const r = m[id] || (m[id] = { n: 0, dmg: 0, hit: 0, hits: 0, heal: 0, shield: 0 });
    if (e.sid) { r.n++; r.dmg += e.dmg || 0; r.hit += e.hitN || 0; r.hits += e.hits || 0; r.heal += e.heal || 0; r.shield += e.shield || 0; }
    if (e.drain) r.heal += e.drain;
  }
  const rows = Object.entries(m).sort((a, b) => b[1].dmg - a[1].dmg);
  if (!rows.length) return '';
  const tot = rows.reduce((a, [, r]) => a + r.dmg, 0) || 1;
  return `<div class="bd"><h3>技ごとの戦績（${esc(name)}）</h3><div class="tblwrap"><table class="sptbl" style="min-width:420px"><thead><tr><th>魔法</th><th>使用</th><th>命中率</th><th>総ダメージ</th><th>割合</th><th>回復・盾</th></tr></thead><tbody>
  ${rows.map(([id, r]) => { const sp = id === 'basic' ? BASIC : SPELL[id];
    return `<tr><td>${sp.el ? elChip(sp.el) + ' ' : ''}${sp.n}</td><td>${r.n}回</td><td>${r.hits ? Math.round(r.hit / r.hits * 100) + '%' : '―'}</td><td>${r.dmg || '―'}</td><td>${r.dmg ? Math.round(r.dmg / tot * 100) + '%' : ''}</td><td>${r.heal ? '回復' + r.heal : ''}${r.shield ? ' 盾' + r.shield : ''}</td></tr>`; }).join('')}
  </tbody></table></div></div>`;
}

function runExamBattle(key, opp) {
  const pf = playerFighter(S, key); const of = oppFighter(opp);
  const exd = SC.exams.find(e => e.key === key);
  battleView(roundName(key), exd.desc || '', pf, of, opp);
  const res = battle(pf, of);
  playBattle(pf, of, res, (won, to) => {
    S._delta = []; const b4 = snap(S); const pb = [...S.passives];
    const lines = examReward(S, key, won);
    const d = diffSnap(b4, snap(S)); mergeDelta(d);
    const np = S.passives.filter(p => !pb.includes(p));
    $('#bres').innerHTML = `<div class="result ${won ? 'win' : 'lose'}">${won ? '勝利！' : '敗北…'}${to ? '<small class="note">（時間切れ・残りHP割合で判定）</small>' : ''}</div><div class="rlines">${lines.map(l => `<p>${esc(l)}</p>`).join('')}</div>${diffRows(d)}${np.map(passiveCard).join('')}${breakdown(res, pf.name)}`;
    TURNLOG[0].lines.push({ t: `${roundName(key)}：${won ? '勝利' : '敗北'}`, c: won ? 'ev' : 'bad' }, ...lines.map(t => ({ t, c: '' })));
    $('#brow').innerHTML = `<button class="btn main" id="nx">${exd.next || '次へ'}</button>`;
    $('#nx').onclick = () => { closeModal(); BUSY = false; S.turn++; startTurn(); };
  });
}
function runCup(idx) { const key = cupRounds(S)[idx]; const opp = getOpponent(S, key); prepBattle(opp, roundName(key), () => runCupBattle(idx, opp), key); }
function runCupBattle(idx, opp) {
  const rounds = cupRounds(S); const key = rounds[idx];
  const pf = playerFighter(S, key); const of = oppFighter(opp);
  battleView(roundName(key), `${S.results.sel ? 'シード枠' : '一般枠'}　第${idx + 1}試合 / 全${rounds.length}試合（HPは試合ごとに全快）`, pf, of, opp);
  const res = battle(pf, of);
  playBattle(pf, of, res, (won, to) => {
    S.results.cupWins = (S.results.cupWins || 0) + (won ? 1 : 0);
    const last = idx === rounds.length - 1;
    if (won && last) S.results.champion = true;
    if (!won) S.results.champion = false;
    $('#bres').innerHTML = `<div class="result ${won ? 'win' : 'lose'}">${won ? (last ? '優勝！' : '勝利！') : '敗退…'}${to ? '<small class="note">（時間切れ・残りHP割合で判定）</small>' : ''}</div>${breakdown(res, pf.name)}`;
    if (won && !last) {
      $('#brow').innerHTML = `<button class="btn main" id="nx">次の試合へ</button>`;
      $('#nx').onclick = () => runCup(idx + 1);
    } else {
      S.results.cupReached = key;
      $('#brow').innerHTML = `<button class="btn main" id="nx">卒業の日へ</button>`;
      $('#nx').onclick = () => { closeModal(); BUSY = false; renderEnd(); };
    }
  });
}

// ---------- エンディング ----------
function renderEnd() {
  const s = S; const r = finalRank(s);
  const reach = s.results.champion ? '優勝' : { cup1: '1回戦敗退', cup2: '準決勝敗退', final: '準優勝' }[s.results.cupReached];
  $('#app').innerHTML = `<div class="panel" style="max-width:760px;margin:24px auto">
    <p class="note">卒業証書　${ORIGINS[s.origin].n}出身 ${esc(s.name)}</p>
    <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div class="rank">${r.g}</div><div><h2 style="margin:0;font-size:26px">${r.t}</h2>
    <p class="note" style="margin:4px 0 0">中間試験 ${s.results.mid ? '合格' : '不合格'}／選抜試験 ${s.results.sel ? '突破' : '敗退'}／卒業大会 ${reach}</p></div></div>
    <div class="stats">${STATS.map(k => `<div class="st"><span>${STAT_NAME[k]}</span><span class="g">${grade(k, s.stats[k])}</span><span class="v">${R0(s.stats[k])}</span><span class="dcell"></span><div class="bar"><span style="width:${Math.min(100, k === 'hp' ? s.stats[k] / 7.5 : s.stats[k] / 2.5)}%"></span></div></div>`).join('')}</div>
    <p><strong>最終ビルド：</strong>${s.equip.map(id => `${elChip(SPELL[id].el)} ${SPELL[id].n}`).join('　')}</p>
    ${s.partner ? `<div class="cheer"><div class="note">盟友</div>${speaker(s.partner)}<p class="txt">${esc(CHAR_STORY[s.partner].ending)}</p><div class="note">サブ適性 ${ELEM[s.sub].n}／絆の物語：${['s20', 's60'].filter(k => s.flags[k + s.partner]).length}章</div></div>` : `<p class="note">盟友の誓いは立てなかった。卒業後の道は、ひとりで切り拓いていく。</p>`}
    <p><strong>適性：</strong>主 ${s.affinity.map(e => ELEM[e].n).join('・')}${s.sub ? `／サブ ${ELEM[s.sub].n}` : ''}</p>
    <p><strong>特性：</strong>${s.passives.map(p => PASSIVES[p].n).join('・') || 'なし'}</p>
    <div class="row"><button class="btn main" id="again">新しい生徒で入学する</button></div></div>`;
  $('#again').onclick = renderTitle;
}

// ---------- モーダル・テーマ ----------
function openModal(html) { $('#modal').innerHTML = html; $('#ov').classList.add('show'); const f = $('#modal button.main') || $('#modal button'); if (f) f.focus(); }
function closeModal() { $('#ov').classList.remove('show'); setTimeout(animateStats, 80); }
function toggleTheme() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = nx;
  try { localStorage.setItem('theme', nx); } catch (e) {}
}
try { const th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
renderTitle();
</script>
